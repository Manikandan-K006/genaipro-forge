  <rect width="64" height="64" rx="16" fill="#050B0A" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#emeraldGrad)" opacity="0.15" stroke="#10B981" stroke-width="2" />
  <text x="32" y="42" font-family="Space Grotesk, system-ui, -apple-system, sans-serif" font-weight="800" font-size="26" fill="#34D399" text-anchor="middle" filter="url(#glow)">MK</text>
